<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DET Practice</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { color: #333; }
    #task { margin-top: 20px; font-size: 18px; }
    input { padding: 5px; font-size: 16px; }
    button { margin-top: 10px; padding: 6px 12px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Read & Complete Practice</h1>
  <p>Заполни пропуск:</p>
  <div id="task"></div>
  <input id="answer" type="text" placeholder="Ваш ответ">
  <button onclick="checkAnswer()">Проверить</button>
  <button onclick="generateTask()">Новое задание</button>
  <p id="result"></p>

  <script>
    const tasks = [
      {text: "In recent years, _____ has become increasingly important in education.", answer: "technology"},
      {text: "One reason people _____ English is to study or work abroad.", answer: "learn"},
      {text: "Technology can _____ communication but also cause distraction.", answer: "improve"}
    ];

    let currentTask;

    function generateTask() {
      currentTask = tasks[Math.floor(Math.random() * tasks.length)];
      document.getElementById("task").innerText = currentTask.text;
      document.getElementById("answer").value = "";
      document.getElementById("result").innerText = "";
    }

    function checkAnswer() {
      const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
      if (userAnswer === currentTask.answer) {
        document.getElementById("result").innerText = "✅ Правильно!";
      } else {
        document.getElementById("result").innerText = "❌ Неправильно. Правильный ответ: " + currentTask.answer;
      }
    }

    generateTask();
  </script>
</body>
</html>
