<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DET Practice</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { color: #333; }
    #task { margin-top: 20px; font-size: 18px; }
    input { padding: 5px; font-size: 16px; }
    button { margin-top: 10px; padding: 6px 12px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Read & Complete Practice</h1>
  <p>Заполни пропуск:</p>
  <div id="task"></div>
  <input id="answer" type="text" placeholder="Ваш ответ">
  <button onclick="checkAnswer()">Проверить</button>
  <button onclick="generateTask()">Новое задание</button>
  <p id="result"></p>

<script>
  const nouns = ["technology", "education", "communication", "innovation", "privacy", "infrastructure"];
  const verbs = ["improve", "undermine", "facilitate", "accelerate", "affect", "generate"];
  const adjs  = ["important", "controversial", "transformative", "beneficial", "harmful", "essential"];
  const effects = ["progress", "confusion", "efficiency", "inequality", "opportunities", "distraction"];

  let currentAnswer;

  function generateSentence() {
    // Несколько шаблонов
    const templates = [
      `In recent years, _____ has become increasingly ${rand(adjs)}.`,
      `One reason people _____ English is to ${rand(verbs)} ${rand(nouns)}.`,
      `${rand(nouns)} can _____ communication but also cause ${rand(effects)}.`,
      `Students often _____ knowledge when they focus on ${rand(nouns)}.`,
      `Modern society depends on _____ to handle ${rand(nouns)} effectively.`
    ];

    const sentence = rand(templates);

    // Определяем правильный ответ (слово в пропуске)
    if (sentence.includes("_____ has")) currentAnswer = rand(nouns);
    else if (sentence.includes("people _____ English")) currentAnswer = "learn";
    else if (sentence.includes("can _____ communication")) currentAnswer = "improve";
    else if (sentence.includes("often _____ knowledge")) currentAnswer = "gain";
    else if (sentence.includes("depends on _____")) currentAnswer = "technology";

    return sentence.replace("_____", "_____");
  }

  function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateTask() {
    const task = generateSentence();
    document.getElementById("task").innerText = task;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";
  }

  function checkAnswer() {
    const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
    if (userAnswer === currentAnswer) {
      document.getElementById("result").innerText = "✅ Правильно!";
    } else {
      document.getElementById("result").innerText = "❌ Неправильно. Правильный ответ: " + currentAnswer;
    }
  }

  generateTask();
</script>
