<!doctype html>
<meta charset="utf-8" />
<div id="passage"></div>
<div id="task"></div>
<script>
const topics = {
  technology: {
    nouns: ["innovation","automation","privacy","infrastructure"],
    verbs: ["facilitate","undermine","accelerate","allocate"],
    adjs: ["prevalent","controversial","transformative","costly"],
    effects: ["inequality","efficiency","data breaches","job displacement"]
  }
};

function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

function genParagraph(topic="technology"){
  const t = topics[topic];
  const s1 = `In recent years, ${topic} has become increasingly ${rand(t.adjs)}.`;
  const s2 = `One key reason is that ${rand(t.nouns)} can ${rand(t.verbs)} critical processes.`;
  const s3 = `As a result, communities may experience ${rand(t.effects)}.`;
  const s4 = `For instance, ${rand(t.nouns)} often ${rand(t.verbs)} public services.`;
  const s5 = `Overall, the benefits tend to outweigh the drawbacks in most contexts.`;
  return [s1,s2,s3,s4,s5].join(' ');
}

function makeCloze(p){
  const tokens = p.split(' ');
  const maskIdx = [];
  for (let i=0;i<tokens.length;i++){
    const w = tokens[i].toLowerCase().replace(/[^a-z]/g,'');
    if (["the","a","an","in","on","at","of","for","to"].includes(w) || /ly$/.test(w)){
      if (Math.random()<0.25) maskIdx.push(i);
    }
  }
  maskIdx.forEach(i => tokens[i] = "_____");
  return {text: tokens.join(' '), hidden: maskIdx};
}

const para = genParagraph();
const cloze = makeCloze(para);
document.getElementById('passage').innerText = para;
document.getElementById('task').innerText = cloze.text;
</script>
